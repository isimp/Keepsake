name: Release

# Manual only. Publishes to GitHub, then to Hexium, Thunderstore or both.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must already match the source)"
        required: true
      notes:
        description: "One line for the top of the release notes (optional)"
        required: false
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false
      stores:
        description: "Where to publish after the GitHub release"
        type: choice
        options:
          - Hexium and Thunderstore
          - Hexium only
          - Thunderstore only
        default: Hexium and Thunderstore
      team:
        description: "Team to publish under on both stores (the package namespace)"
        required: true
        default: "isimp"
      hexium_categories:
        description: "Hexium categories, comma separated"
        required: false
        default: "Quality of Life,Config,User Interface,Tools,Open Source,Valheim 1.0"
      thunderstore_categories:
        description: "Thunderstore category slugs, comma separated (keep ai-generated)"
        required: false
        default: "ai-generated,mods,tools,utility,client-side,deep-north-update"

env:
  # Thunderstore packages list BepInEx so mod managers install it; Hexium assumes it and
  # must not have it listed. Added to the Thunderstore package's manifest only.
  THUNDERSTORE_BEPINEX: "denikson-BepInExPack_Valheim-5.4.2350"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The version lives in three places that have to agree with each other and with what was
      # typed. Checked before anything is built, so a mismatch costs seconds rather than
      # producing a release whose DLLs or package report a different version than its tag.
      # Inputs are passed through the environment rather than pasted into the script, so what
      # is typed in the dispatch form is data and never shell.
      - name: Check the version matches the source
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          want="$WANT"

          props=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          plugin=$(grep -oPm1 'public const string Version = "\K[^"]+' src/Keepsake/Plugin.cs)
          manifest=$(grep -oPm1 '"version_number"\s*:\s*"\K[^"]+' packaging/manifest.json)

          echo "asked for          : $want"
          echo "Directory.Build.props: $props"
          echo "Plugin.cs          : $plugin"
          echo "manifest.json      : $manifest"

          if [ "$props" != "$want" ] || [ "$plugin" != "$want" ] || [ "$manifest" != "$want" ]; then
            echo "::error::Version mismatch. Set $want in Directory.Build.props (<Version>), src/Keepsake/Plugin.cs (Version) and packaging/manifest.json (version_number), then run this again."
            exit 1
          fi

      # The icon is committed by hand. Checked up front so a missing one reads as a missing
      # icon rather than as a copy error halfway through packaging.
      - name: Check the icon is there
        run: |
          if [ ! -f packaging/icon.png ]; then
            echo "::error::packaging/icon.png is missing. Drop a 256x256 PNG there and commit it."
            exit 1
          fi
          echo "icon present"

      # The README shows the screenshot from GitHub on every store page, so a release without it
      # would ship a broken image.
      - name: Check the screenshot is there
        run: |
          if [ ! -f docs/images/screenshot.webp ]; then
            echo "::error::docs/images/screenshot.webp is missing. Add the screenshot the README shows and commit it."
            exit 1
          fi
          echo "screenshot present"

      # Publishing is part of releasing here, so a missing token is a failure now rather than
      # after the GitHub release already exists.
      - name: Check the Hexium token is set
        if: contains(inputs.stores, 'Hexium')
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
        run: |
          if [ -z "${HEXIUM_TOKEN:-}" ]; then
            echo "::error::HEXIUM_TOKEN is not set. Create an API token in your Hexium team settings and add it as a repository secret."
            exit 1
          fi
          echo "token present"

      - name: Check the Thunderstore token is set
        if: contains(inputs.stores, 'Thunderstore')
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: |
          if [ -z "${THUNDERSTORE_TOKEN:-}" ]; then
            echo "::error::THUNDERSTORE_TOKEN is not set. Create a service account token in your Thunderstore team settings and add it as a repository secret."
            exit 1
          fi
          echo "token present"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Keepsake.sln -c Release -p:LibsDir=lib --nologo

      # Mod sites want the manifest, icon and README at the root of the archive. The plugin
      # goes in plugins/ and the preloader in patchers/, which mod managers install into
      # BepInEx/plugins and BepInEx/patchers.
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="Keepsake-$VERSION"

          mkdir -p dist/package/plugins dist/package/patchers
          cp src/Keepsake/bin/Release/Keepsake.dll dist/package/plugins/
          cp src/Keepsake.Preloader/bin/Release/Keepsake.Preloader.dll dist/package/patchers/
          cp packaging/manifest.json packaging/icon.png dist/package/
          cp README.md CHANGELOG.md LICENSE dist/package/

          mkdir -p dist/hexium dist/thunderstore
          (cd dist/package && zip -qr "../hexium/$name.zip" .)

          jq --arg dep "$THUNDERSTORE_BEPINEX" '.dependencies = [$dep] + .dependencies' \
            packaging/manifest.json > dist/package/manifest.json
          (cd dist/package && zip -qr "../thunderstore/$name.zip" .)

          echo "--- package contents ---"
          unzip -l "dist/hexium/$name.zip"

      # Everything the sites require of the archive (files at the root, a 256x256 icon, the
      # name and description rules) checked before anything is published.
      - name: Check the packages
        env:
          NAME: Keepsake-${{ inputs.version }}.zip
        run: |
          python3 tools/publish.py "dist/hexium/$NAME" --check-only
          python3 tools/publish.py "dist/thunderstore/$NAME" --check-only

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Keepsake ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            ${{ inputs.notes }}

            Install with a mod manager, or unzip and copy `plugins/Keepsake.dll` into `BepInEx/plugins` and `patchers/Keepsake.Preloader.dll` into `BepInEx/patchers`. Both are needed.

            Requires BepInEx 5 and Jotunn. Client-side only; servers do not need it.

            Press Home to open the panel. The key can be changed in the config.
          files: |
            dist/hexium/Keepsake-${{ inputs.version }}.zip

      # If a publish step fails, fix the cause and run the workflow again with only the store
      # that failed: the release step above updates the existing release rather than making a
      # second one, and each store refuses a version it already has.
      - name: Publish to Hexium
        if: contains(inputs.stores, 'Hexium')
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
          PACKAGE: dist/hexium/Keepsake-${{ inputs.version }}.zip
          TEAM: ${{ inputs.team }}
          CATEGORIES: ${{ inputs.hexium_categories }}
        run: python3 tools/publish.py "$PACKAGE" --store hexium --team "$TEAM" --categories "$CATEGORIES"

      - name: Publish to Thunderstore
        if: contains(inputs.stores, 'Thunderstore')
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
          PACKAGE: dist/thunderstore/Keepsake-${{ inputs.version }}.zip
          TEAM: ${{ inputs.team }}
          CATEGORIES: ${{ inputs.thunderstore_categories }}
        run: python3 tools/publish.py "$PACKAGE" --store thunderstore --team "$TEAM" --categories "$CATEGORIES"
